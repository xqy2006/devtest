name: modeltrace-pair
# One push of the RUN file = one run: a quick smoke pass of every experiment, then all
# experiments in parallel, then one merged artifact (all-results).
on:
  push:
    branches: [modeltrace-pair]
    paths: [RUN]
  workflow_dispatch:
concurrency:
  group: modeltrace-pair
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: smoke pass (tiny sizes)
        env:
          SMOKE: "1"
        run: |
          python research/curve_pair.py diag len:990:clean len:990:cleanb ref:3:0:clean rep:2:0:clean
          python research/curve_pair.py merge results
  run:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        exp: ["diag len:990:clean len:990:cleanb len:990",
              "ref:3:0:clean ref:6:0:clean ref:9:0:clean rep:2:0:clean rep:4:0:clean",
              "ref:3:1:clean ref:6:1:clean ref:9:1:clean rep:2:1:clean rep:4:1:clean"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: experiment ${{ matrix.exp }}
        timeout-minutes: 340
        shell: bash
        run: |
          mkdir -p results
          tag=$(echo "${{ matrix.exp }}" | tr ': ' '_-')
          if [ "${{ matrix.exp }}" = prereg_adapt ]; then
            python research/pilot_long_eval.py data/pilot_4router_1000 --adapt 2>&1 | tee results/prereg_adapt.log
            cp research/out_pilot_long.json results/prereg_adapt.json
          elif [[ "${{ matrix.exp }}" == stack:* ]]; then
            python research/stack_pair.py fold "${tag#stack_}" 2>&1 | tee "results/$tag.log"
          elif [[ "${{ matrix.exp }}" =~ ^(ref|rep|len|libwin|diag) ]]; then
            python research/curve_pair.py ${{ matrix.exp }} 2>&1 | tee "results/curve_$tag.log"
          else
            python research/runner_pair.py "${{ matrix.exp }}" 2>&1 | tee "results/$tag.log"
          fi
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: res-*
          merge-multiple: true
      - name: merge curve results
        run: |
          mkdir -p results && cp all/curve_*.json results/ 2>/dev/null || true
          cp data/run3/curve_*.json results/ 2>/dev/null || true
          python research/curve_pair.py merge results 2>&1 | tee all/curve.log || true
          cp results/curve.json all/ 2>/dev/null || true
          ls -la all
      - uses: actions/upload-artifact@v4
        with:
          name: all-results
          path: all/
