name: modeltrace-pair
# One push of the RUN file = one run: one job per matrix entry in parallel (each job's log can be read once
# that job finishes), then an optional aggregate job that sees every job's results/ (env AGGREGATE).
# A runner has 4 cores: scripts run their folds in one process each (BLAS limited to one thread).
on:
  push:
    branches: [modeltrace-pair]
    paths: [RUN]
  workflow_dispatch:
concurrency:
  group: modeltrace-pair
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
  AGGREGATE: ""
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        exp: ["python research/range355_check.py"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: ${{ matrix.exp }}
        run: |
          set -o pipefail
          mkdir -p results
          ${{ matrix.exp }} 2>&1 | tee "results/job_${{ strategy.job-index }}.log"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: res-*
          merge-multiple: true
          path: results
      - name: aggregate
        run: |
          set -o pipefail
          if [ -z "$AGGREGATE" ]; then echo "no aggregate step"; exit 0; fi
          pip install -q -r requirements.txt
          eval "$AGGREGATE" 2>&1 | tee results/aggregate.log
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-aggregate
          path: results/
          if-no-files-found: warn
