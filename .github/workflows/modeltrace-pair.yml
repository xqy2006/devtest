name: modeltrace-pair
# One push of the RUN file = one run: a quick smoke pass, then the experiments in parallel, then one
# merged artifact (all-results). Every job edits one comment on issue LIVE_ISSUE with the tail of its
# log every minute, because the API does not serve the logs of running jobs.
on:
  push:
    branches: [modeltrace-pair]
    paths: [RUN]
  workflow_dispatch:
concurrency:
  group: modeltrace-pair
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
env:
  PYTHONUNBUFFERED: "1"
  LIVE_ISSUE: "1"
  GH_TOKEN: ${{ github.token }}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: smoke pass (tiny sizes)
        env:
          SMOKE: "1"
        run: bash research/live.sh smoke python research/sol_pair.py fix:re:env:1:cv:loeo fix:re:none:0:1
  run:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        exp: ["fix:re:none:0:lw:loeo fix:re:none:0:0.95:loeo",
              "fix:re:none:0:1:loeo fix:re:env:1:1:loeo",
              "fix:re:env:1:0.5:loeo fix:re:env:1:0.8:loeo",
              "fix:re:env:1:0.95:loeo fix:re:env:1:cv:loeo",
              "fix:re:env:1:lw:loeo fix:re:none:0:cv:loeo"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: experiment ${{ matrix.exp }}
        timeout-minutes: 340
        run: bash research/live.sh "${{ matrix.exp }}" python research/sol_pair.py ${{ matrix.exp }}
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: res-*
          merge-multiple: true
      - run: ls -la all
      - uses: actions/upload-artifact@v4
        with:
          name: all-results
          path: all/
