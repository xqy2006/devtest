name: modeltrace-pair
# One push of the RUN file = one run: a quick smoke pass, then one job per experiment in parallel
# (a finished job's log can be read while the others still run), then one merged artifact.
on:
  push:
    branches: [modeltrace-pair]
    paths: [RUN]
  workflow_dispatch:
concurrency:
  group: modeltrace-pair
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: smoke pass (tiny sizes)
        env:
          SMOKE: "1"
        run: python research/sol_pair.py fix:re:env:1:cv:loeo "fix:re:none:0:1@val.dg.pb.bd.jj:loeo"
  run:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        exp: ["fix:re:none:0:lw:loeo", "fix:re:none:0:0.95:loeo", "fix:re:none:0:1:loeo", "fix:re:none:0:cv:loeo",
              "fix:re:env:1:lw:loeo", "fix:re:env:1:0.5:loeo", "fix:re:env:1:0.8:loeo", "fix:re:env:1:0.95:loeo",
              "fix:re:env:1:1:loeo", "fix:re:env:1:cv:loeo",
              "fix:re:env:1:cv@val.dg.pb.bd.jj:loeo", "fix:re:env:1:cv@val.j1.j2.dg.bd.jj.pb.cv:loeo"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: experiment ${{ matrix.exp }}
        run: |
          mkdir -p results
          python research/sol_pair.py "${{ matrix.exp }}" 2>&1 | tee "results/sol_$(echo '${{ matrix.exp }}' | tr ':@' '_-').log"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          pattern: res-*
          merge-multiple: true
      - run: ls -la all
      - uses: actions/upload-artifact@v4
        with:
          name: all-results
          path: all/
