name: modeltrace-pair
# One push of the RUN file = one run: one job per experiment in parallel (a finished job's log can be
# read while the others still run), then one merged artifact.
on:
  push:
    branches: [modeltrace-pair]
    paths: [RUN]
  workflow_dispatch:
concurrency:
  group: modeltrace-pair
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        exp: ["python research/hard_pair.py refine"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: ${{ matrix.exp }}
        run: |
          set -o pipefail
          mkdir -p results
          ${{ matrix.exp }} 2>&1 | tee "results/job_${{ strategy.job-index }}.log"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: res-${{ strategy.job-index }}
          path: results/
          if-no-files-found: warn
